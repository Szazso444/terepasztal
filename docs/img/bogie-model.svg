<text x="700" y="444" font-size="15" fill="#333">body half-width 0.13 to 0.15: bogies never show beside the body.</text>
<text x="700" y="480" font-size="15" fill="#333">Slices come from the same part drawers with an l-range clip;</text>
<text x="700" y="502" font-size="15" fill="#333">the art code does not change, only the Frame clips.</text>
<text x="700" y="538" font-size="15" fill="#333">Draw order: bogie just under its own slice.</text>
<text x="700" y="560" font-size="15" fill="#333">Reversal: same polyline, same facings, motion backwards; no re-pose.</text>
<text x="700" y="600" font-size="13" fill="#666">Top view. Rules in docs/bogie-model.md.</text>
</svg>