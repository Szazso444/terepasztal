<!doctype html><html lang="en"><meta charset="utf-8"><title>pump-hand-back-walk diagnostic candidate</title><style>body{background:#78804c;color:#e4d5b5;font:16px system-ui}canvas{image-rendering:pixelated}.zoom{width:512px;height:256px}table{border-collapse:collapse}td,th{padding:6px;border:1px solid #e4d5b5}</style><h1>Diagnostic candidate — not accepted</h1><p>Uniform scale and body anchors. Original strip unchanged. Three frame boxes exceed the5percent requirement.</p><canvas id="native" width="64" height="32"></canvas><canvas id="zoom" class="zoom" width="64" height="32"></canvas><p><button id="pause">Pause</button><select id="phase"><option value="animate">Animate</option><option value="0">f0</option><option value="1">f1</option><option value="2">f2</option><option value="3">f3</option></select><span id="current"></span></p><table><tr><th>Frame</th><th>Width error</th><th>Height error</th><th>Box pass</th></tr><tr><td>f0</td><td>1.4%</td><td>0.3%</td><td>true</td></tr><tr><td>f1</td><td>11.3%</td><td>2.1%</td><td>false</td></tr><tr><td>f2</td><td>15.1%</td><td>2.1%</td><td>false</td></tr><tr><td>f3</td><td>13.0%</td><td>0.0%</td><td>false</td></tr></table><p>f0 over f2 at50percent opacity:</p><img src="pump-hand-back-walk-candidate-contact-overlay.png"><script>let paused=false,frame=0;const image=new Image();image.src="pump-hand-back-walk-candidate-9px.png";function draw(){const value=document.getElementById("phase").value;const k=value==="animate"?frame:Number(value);for(const id of ["native","zoom"]){const c=document.getElementById(id).getContext("2d");c.clearRect(0,0,64,32);if(image.complete&&image.naturalWidth)c.drawImage(image,k*64,0,64,32,0,0,64,32)}document.getElementById("current").textContent=" f"+k}document.getElementById("pause").onclick=()=>{paused=!paused};document.getElementById("phase").onchange=draw;setInterval(()=>{if(!paused)frame=(frame+1)%4;draw()},240);</script></html>
