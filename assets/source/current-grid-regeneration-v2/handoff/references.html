<!doctype html><html lang="en"><meta charset="utf-8"><title>Original building reference inventory</title><style>body{margin:20px;background:#24392e;color:#efebdb;font:14px system-ui}main{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}figure{margin:0;background:#3b4e40;border-radius:5px;padding:8px}img{width:100%;height:230px;object-fit:contain}figcaption{height:45px}</style><h1>Original designs · footprint review</h1><main></main><script type="module">const m=await(await fetch('./manifest.json')).json();for(const a of m.assets){const f=document.createElement('figure');f.innerHTML=`<img src="${a.original}"><figcaption>${a.name}<br>${a.key} · ${a.tiles} tile(s)</figcaption>`;document.querySelector('main').append(f);}await Promise.all([...document.images].map(i=>i.decode()));window.ready=true;</script></html>
